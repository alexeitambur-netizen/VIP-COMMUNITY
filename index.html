<script>
        // ============================================
        // БЕЗОПАСНОЕ ХРАНИЛИЩЕ (fix для sandboxed Telegram WebApp)
        // ============================================
        const SafeStorage = {
            _memory: {},
            getItem(key) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        return localStorage.getItem(key);
                    }
                } catch (e) {
                    // Sandboxed environment - fallback to memory + sessionStorage
                    try {
                        if (typeof sessionStorage !== 'undefined') {
                            return sessionStorage.getItem(key);
                        }
                    } catch (_) {}
                    return this._memory[key] || null;
                }
                return null;
            },
            setItem(key, value) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem(key, value);
                        return;
                    }
                } catch (e) {
                    try {
                        if (typeof sessionStorage !== 'undefined') {
                            sessionStorage.setItem(key, value);
                            return;
                        }
                    } catch (_) {}
                    this._memory[key] = value;
                }
            },
            removeItem(key) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        localStorage.removeItem(key);
                        return;
                    }
                } catch (e) {
                    try {
                        if (typeof sessionStorage !== 'undefined') {
                            sessionStorage.removeItem(key);
                            return;
                        }
                    } catch (_) {}
                    delete this._memory[key];
                }
            }
        };

        // ============================================
        // HAPTIC FEEDBACK (вибрация на каждое касание во всех разделах)
        // ============================================
        function triggerHaptic(style = 'light') {
            try {
                if (window.Telegram && 
                    window.Telegram.WebApp && 
                    window.Telegram.WebApp.HapticFeedback) {
                    
                    const hf = window.Telegram.WebApp.HapticFeedback;
                    
                    if (style === 'success' || style === 'error' || style === 'warning') {
                        hf.notificationOccurred(style);
                    } else {
                        hf.impactOccurred(style); // light, medium, heavy, rigid, soft
                    }
                }
            } catch (e) {}
        }

        function initGlobalHaptic() {
            // Основной обработчик на клик
            document.addEventListener('click', function(e) {
                const target = e.target.closest(
                    '.card, .back-btn, .pair-row, .note-card, .mode-btn, ' +
                    '.direction-btn, .modal-category-btn, .send-btn, ' +
                    'button, .note-chip, .del-btn, .strategy-card, .pattern-card'
                );
                
                if (target) {
                    if (target.classList.contains('note-card') || target.classList.contains('pair-row')) {
                        triggerHaptic('light');
                    } else if (target.classList.contains('back-btn') && 
                              (target.style.background || '').includes('neon-green')) {
                        triggerHaptic('medium');
                    } else {
                        triggerHaptic('light');
                    }
                }
            }, { passive: true });

            // Touchstart для более быстрой вибрации
            document.addEventListener('touchstart', function(e) {
                const target = e.target.closest(
                    '.card, .back-btn, .pair-row, .note-card, .mode-btn, button, .strategy-card, .pattern-card'
                );
                if (target) {
                    triggerHaptic('light');
                }
            }, { passive: true });
        }

        // ============================================
        // ЛОГИКА БЕЗОПАСНОСТИ И АВТОРИЗАЦИИ (СЕРВЕРНАЯ СИНХРОНИЗАЦИЯ)
        // ============================================
        const MASTER_ADMIN = "5817328317";
        const SERVER_URL = "https://vip-community.onrender.com";  // ← Актуальный URL бэкенда

        // Глобальный кэш списка (чтобы не дёргать сервер каждый раз)
        let _allowedUsersCache = null;

        function getAllowedUsers() {
            if (_allowedUsersCache) return _allowedUsersCache;
            try {
                return JSON.parse(SafeStorage.getItem('allowed_users') || "[]");
            } catch {
                return [];
            }
        }

        // === НОВЫЕ ФУНКЦИИ СЕРВЕРНОЙ СИНХРОНИЗАЦИИ ===
        async function fetchAllowedUsersFromServer() {
            try {
                const res = await fetch(`${SERVER_URL}/api/allowed-users`, { method: 'GET' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.users)) {
                        _allowedUsersCache = data.users;
                        SafeStorage.setItem('allowed_users', JSON.stringify(data.users));
                        return data.users;
                    }
                }
            } catch (e) {
                console.warn("[PRO AI] Не удалось загрузить список пользователей с сервера, используем локальный кэш");
            }
            return getAllowedUsers();
        }

        async function syncAddUserToServer(userId) {
            try {
                // Используем защищённый эндпоинт с явной передачей adminId
                const response = await fetch(`${SERVER_URL}/api/admin/add-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId: String(userId),
                        adminId: MASTER_ADMIN 
                    })
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    console.error("[PRO AI] Ошибка добавления пользователя на сервер:", result.error || result);
                    alert("Ошибка сохранения в Supabase: " + (result.error || "Неизвестная ошибка"));
                    return false;
                }
                
                console.log("[PRO AI] Пользователь успешно добавлен в Supabase");
                await fetchAllowedUsersFromServer();
                return true;
            } catch (e) {
                console.error("[PRO AI] Критическая ошибка отправки пользователя на сервер:", e);
                alert("Не удалось связаться с сервером. Проверь подключение.");
                return false;
            }
        }

        async function syncRemoveUserFromServer(userId) {
            try {
                const response = await fetch(`${SERVER_URL}/api/admin/remove-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        userId: String(userId),
                        adminId: MASTER_ADMIN 
                    })
                });
                
                const result = await response.json();
                if (!response.ok || !result.success) {
                    console.error("[PRO AI] Ошибка удаления из Supabase:", result.error);
                    alert("Ошибка удаления: " + (result.error || "Неизвестная ошибка"));
                } else {
                    console.log("[PRO AI] Пользователь удалён из Supabase");
                }
                await fetchAllowedUsersFromServer();
            } catch (e) {
                console.error("[PRO AI] Критическая ошибка удаления:", e);
            }
        }

        async function checkAccess(userId) {
            const ADMIN_LIST = [644265574, 8357464471, 987654321];
            const localList = getAllowedUsers();
            
            if (userId === MASTER_ADMIN || ADMIN_LIST.includes(Number(userId)) || localList.includes(String(userId))) {
                return true;
            }
            
            // Пробуем проверить через сервер (главный источник истины)
            try {
                const response = await fetch(`${SERVER_URL}/api/check-access?userId=${userId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (typeof data.allowed === 'boolean') {
                        return data.allowed;
                    }
                }
            } catch (e) {
                console.error("Ошибка проверки доступа на сервере:", e);
            }
            
            // Fallback: если сервер недоступен — пускаем (для стабильности)
            return true;
        }

        // === Обновлённые функции добавления/удаления (с синхронизацией на сервер) ===
        window.addAllowedUser = async function() {
            const idInput = document.getElementById('new-user-id');
            const id = idInput.value.trim();
            if (!id || id === MASTER_ADMIN) {
                alert("Некорректный ID");
                return;
            }
            
            // Сначала обновляем локально для мгновенного отклика
            let users = getAllowedUsers();
            if (!users.includes(id)) {
                users.push(id);
                SafeStorage.setItem('allowed_users', JSON.stringify(users));
                _allowedUsersCache = users;
                renderAdminList();
            }
            
            // Отправляем на сервер (Supabase)
            const success = await syncAddUserToServer(id);
            
            if (success) {
                alert("Пользователь успешно добавлен в Supabase!");
            }
            
            idInput.value = '';
            
            // Финальная синхронизация
            await renderAdminList();
        };

        window.removeUser = async function(id) {
            if (!confirm(`Удалить пользователя ${id} из Supabase?`)) return;
            
            let users = getAllowedUsers().filter(u => u !== String(id));
            SafeStorage.setItem('allowed_users', JSON.stringify(users));
            _allowedUsersCache = users;
            renderAdminList();
            
            await syncRemoveUserFromServer(id);
            await renderAdminList();
        };

        async function renderAdminList() {
            const list = document.getElementById('admin-users-list');
            if (!list) return;
            
            // Всегда пытаемся получить свежий список с сервера
            const users = await fetchAllowedUsersFromServer();
            
            list.innerHTML = '';
            
            const masterItem = document.createElement('div');
            masterItem.className = 'admin-item';
            masterItem.style.borderColor = 'var(--neon-green)';
            masterItem.innerHTML = `<span style="color:var(--neon-green); font-weight:900;">${MASTER_ADMIN} [ROOT ADMIN]</span> <span></span>`;
            list.appendChild(masterItem);

            users.forEach(id => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `<span>USER: ${id}</span> <span class="del-btn" onclick="removeUser('${id}')">DROP</span>`;
                list.appendChild(item);
            });
        }

        // ============================================
        // DEVELOPER PANEL FUNCTIONS (только ROOT ADMIN)
        // ============================================
        let currentDevTab = 'admins';

        window.showDevTab = function(tab) {
            // Hide all tabs
            document.getElementById('dev-tab-admins').style.display = 'none';
            document.getElementById('dev-tab-theme').style.display = 'none';
            document.getElementById('dev-tab-flags').style.display = 'none';
            document.getElementById('dev-tab-console').style.display = 'none';
            const videoTab = document.getElementById('dev-tab-video');
            if (videoTab) videoTab.style.display = 'none';

            // Reset button styles
            document.getElementById('dev-tab-btn-admins').style.background = 'rgba(255,255,255,0.05)';
            document.getElementById('dev-tab-btn-theme').style.background = 'rgba(255,255,255,0.05)';
            document.getElementById('dev-tab-btn-flags').style.background = 'rgba(255,255,255,0.05)';
            document.getElementById('dev-tab-btn-console').style.background = 'rgba(255,255,255,0.05)';
            const videoBtn = document.getElementById('dev-tab-btn-video');
            if (videoBtn) videoBtn.style.background = 'rgba(255,255,255,0.05)';

            // Show selected
            const selectedTab = document.getElementById('dev-tab-' + tab);
            if (selectedTab) selectedTab.style.display = 'block';
            const selectedBtn = document.getElementById('dev-tab-btn-' + tab);
            if (selectedBtn) {
                selectedBtn.style.background = 'var(--neon-purple)';
                selectedBtn.style.color = '#fff';
            }

            currentDevTab = tab;

            if (tab === 'admins') renderDevAdminList();
            if (tab === 'flags') renderFeatureFlags();
            if (tab === 'video') renderDevVideoList();
            if (tab === 'theme') {
                // Prefill current values
                const root = getComputedStyle(document.documentElement);
                const green = root.getPropertyValue('--neon-green').trim() || '#00FFAA';
                const purple = root.getPropertyValue('--neon-purple').trim() || '#9D00FF';
                const red = root.getPropertyValue('--neon-red').trim() || '#FF2E63';
                
                const gInput = document.getElementById('theme-green');
                const pInput = document.getElementById('theme-purple');
                const rInput = document.getElementById('theme-red');
                
                if (gInput) gInput.value = green.startsWith('#') ? green : '#00FFAA';
                if (pInput) pInput.value = purple.startsWith('#') ? purple : '#9D00FF';
                if (rInput) rInput.value = red.startsWith('#') ? red : '#FF2E63';
            }
        };

        // === YouTube Video Lessons Management via Supabase ===
        window.VIDEO_LESSONS = window.VIDEO_LESSONS || [];
        let videoLessonsCache = [];

        async function loadVideoLessonsFromServer() {
            try {
                const response = await fetch(`${SERVER_URL}/api/video-lessons`);
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data && data.success && Array.isArray(data.lessons)) {
                        videoLessonsCache = data.lessons;
                    } else if (Array.isArray(data)) {
                        videoLessonsCache = data;
                    } else {
                        videoLessonsCache = [];
                    }
                    
                    window.VIDEO_LESSONS = videoLessonsCache;
                    console.log(`[VIDEO] Загружено ${videoLessonsCache.length} видеоуроков из Supabase`);
                    return videoLessonsCache;
                } else {
                    console.warn(`[VIDEO] /api/video-lessons вернул статус ${response.status}`);
                }
            } catch (e) {
                console.warn('[VIDEO] Ошибка загрузки с сервера:', e.message);
            }
            
            // Fallback к локальному хранилищу
            try {
                const local = JSON.parse(SafeStorage.getItem('custom_video_lessons') || '[]');
                videoLessonsCache = local;
                window.VIDEO_LESSONS = local;
            } catch (_) {
                videoLessonsCache = [];
                window.VIDEO_LESSONS = [];
            }
            return videoLessonsCache;
        }
        window.loadVideoLessonsFromServer = loadVideoLessonsFromServer;

        function getAllVideoLessons() {
            return (videoLessonsCache && videoLessonsCache.length > 0) ? videoLessonsCache : (window.VIDEO_LESSONS || []);
        }
        window.getAllVideoLessons = getAllVideoLessons;

        function getCustomVideoLessons() {
            return getAllVideoLessons();
        }
        window.getCustomVideoLessons = getCustomVideoLessons;

        function saveCustomVideoLessons(list) {
            SafeStorage.setItem('custom_video_lessons', JSON.stringify(list || []));
            videoLessonsCache = list || [];
            window.VIDEO_LESSONS = videoLessonsCache;
        }
        window.saveCustomVideoLessons = saveCustomVideoLessons;

        function renderDevVideoList() {
            const container = document.getElementById('dev-video-list');
            if (!container) return;
            container.innerHTML = '';

            const list = getAllVideoLessons();
            if (list.length === 0) {
                container.innerHTML = '<div style="color:#a4b1cd; font-size:12px; padding:10px; text-align:center;">Пока нет добавленных уроков.<br>Добавь первый выше — он сохранится в Supabase и будет виден ВСЕМ.</div>';
                return;
            }

            list.forEach((lesson, index) => {
                const item = document.createElement('div');
                item.style.cssText = 'background:rgba(0,0,0,0.5); border:1px solid rgba(157,0,255,0.3); border-radius:14px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center;';
                const customTag = lesson.isCustom ? ' <span style="background:rgba(157,0,255,0.45); color:#fff; padding:1px 6px; border-radius:5px; font-size:9px; font-weight:800;">CUSTOM</span>' : '';
                item.innerHTML = `
                    <div style="flex:1; min-width:0;">
                        <div style="font-weight:800; color:#fff; font-size:13px; line-height:1.2;">${lesson.title \vert{}\vert{} 'Без названия'}${customTag}</div>
                        <div style="font-size:11px; color:#a4b1cd;">${lesson.category || '—'} • ${lesson.duration \vert{}\vert{} ''} •${lesson.level || ''}</div>
                    </div>
                    <button onclick="devDeleteVideoLesson(${index}, '${lesson.id || ''}')" style="background:rgba(255,46,99,0.2); color:var(--neon-red); border:1px solid rgba(255,46,99,0.4); padding:6px 12px; border-radius:999px; font-size:11px; font-weight:900; cursor:pointer;">УДАЛИТЬ</button>
                `;
                container.appendChild(item);
            });
        }

        window.devAddVideoLesson = async function() {
            const titleEl = document.getElementById('new-video-title');
            const youtubeEl = document.getElementById('new-video-youtube');
            const categoryEl = document.getElementById('new-video-category');
            const durationEl = document.getElementById('new-video-duration');
            const levelEl = document.getElementById('new-video-level');
            const descEl = document.getElementById('new-video-desc');

            const title = (titleEl && titleEl.value || '').trim();
            const youtube = (youtubeEl && youtubeEl.value || '').trim();
            const category = (categoryEl && categoryEl.value) || 'basics';
            const duration = (durationEl && durationEl.value || '').trim() || '15 мин';
            const level = (levelEl && levelEl.value || '').trim() || 'Средний';
            const desc = (descEl && descEl.value || '').trim() || 'Добавленный урок разработчика.';

            if (!title || !youtube) {
                alert('Название и YouTube ссылка обязательны!');
                return;
            }

            const newLesson = {
                id: Date.now(),
                title,
                category,
                duration,
                level,
                desc,
                youtube,
                isCustom: true,
                created_at: new Date().toISOString()
            };

            // 1. Пытаемся сохранить в Supabase через сервер
            try {
                const res = await fetch(`${SERVER_URL}/api/video-lessons`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newLesson)
                });
                if (res.ok) {
                    await loadVideoLessonsFromServer();
                    renderDevVideoList();
                    if (typeof renderVideoLessons === 'function') {
                        renderVideoLessons('all');
                    }
                    if (titleEl) titleEl.value = '';
                    if (youtubeEl) youtubeEl.value = '';
                    if (descEl) descEl.value = '';
                    alert('✅ Видеоурок сохранён в Supabase!\nТеперь он доступен ВСЕМ пользователям в разделе Видеообучение.');
                    return;
                } else {
                    throw new Error('HTTP ' + res.status);
                }
            } catch (e) {
                console.error('[VIDEO] Полная ошибка сохранения на сервер:', e);
                
                let errorMessage = 'Неизвестная ошибка';
                if (e.message && e.message.includes('Failed to fetch')) {
                    errorMessage = 'Сетевая ошибка / сервер недоступен (проверь интернет или URL бэкенда)';
                } else if (e.message && e.message.includes('HTTP')) {
                    errorMessage = 'Сервер вернул ошибку: ' + e.message;
                } else {
                    errorMessage = e.message || String(e);
                }

                // Fallback
                let custom = [];
                try {
                    custom = JSON.parse(SafeStorage.getItem('custom_video_lessons') || '[]');
                } catch (_) {}
                custom.push(newLesson);
                SafeStorage.setItem('custom_video_lessons', JSON.stringify(custom));
                videoLessonsCache = custom;
                window.VIDEO_LESSONS = custom;

                renderDevVideoList();
                if (typeof renderVideoLessons === 'function') renderVideoLessons('all');

                alert(
                    '⚠️ Сохранено только на ЭТОМ устройстве.\n\n' +
                    'Ошибка подключения к серверу: ' + errorMessage + '\n\n' +
                    'Что делать:\n' +
                    '1. Убедись, что на Render задеплоен server-fixed.js (с эндпоинтом /api/video-lessons)\n' +
                    '2. Проверь, что таблица video_lessons существует в Supabase (с колонками title, category, youtube, description, level)\n' +
                    '3. Убедись, что SERVER_URL в этом файле = https://vip-community.onrender.com\n' +
                    '4. Сделай Redeploy на Render\n\n' +
                    'Текущий SERVER_URL: ' + SERVER_URL
                );
            }
        };

        window.devDeleteVideoLesson = async function(index, lessonId = '') {
            if (!confirm('Удалить урок? Это повлияет на ВСЕХ пользователей.')) return;

            const list = getAllVideoLessons();
            if (!list[index]) return;
            const lesson = list[index];
            const idToDelete = lessonId || lesson.id || lesson.title;

            if (idToDelete) {
                try {
                    const res = await fetch(`${SERVER_URL}/api/video-lessons?id=${encodeURIComponent(idToDelete)}`, {
                        method: 'DELETE'
                    });
                    if (res.ok) {
                        await loadVideoLessonsFromServer();
                        renderDevVideoList();
                        if (typeof renderVideoLessons === 'function') renderVideoLessons('all');
                        return;
                    }
                } catch (e) {
                    console.warn('[VIDEO DELETE] Серверная ошибка удаления:', e.message);
                }
            }

            // Fallback
            let custom = [];
            try { custom = JSON.parse(SafeStorage.getItem('custom_video_lessons') || '[]'); } catch(_) {}
            custom = custom.filter(l => l.id !== lesson.id && l.title !== lesson.title);
            SafeStorage.setItem('custom_video_lessons', JSON.stringify(custom));
            videoLessonsCache = custom;
            window.VIDEO_LESSONS = custom;
            renderDevVideoList();
            if (typeof renderVideoLessons === 'function') renderVideoLessons('all');
        };

        // === Admin Management in Developer Panel ===
        window.devAddAdmin = async function() {
            const input = document.getElementById('dev-new-admin-id');
            const id = input.value.trim();
            if (!id || id === MASTER_ADMIN) return;

            let users = getAllowedUsers();
            if (!users.includes(id)) {
                users.push(id);
                SafeStorage.setItem('allowed_users', JSON.stringify(users));
                _allowedUsersCache = users;

                await syncAddUserToServer(id);
                renderDevAdminList();
            }
            input.value = '';
        };

        window.devRemoveAdmin = async function(id) {
            if (!confirm('Удалить администратора ' + id + '?')) return;

            let users = getAllowedUsers().filter(u => u !== String(id));
            SafeStorage.setItem('allowed_users', JSON.stringify(users));
            _allowedUsersCache = users;

            await syncRemoveUserFromServer(id);
            renderDevAdminList();
        };

        async function renderDevAdminList() {
            const list = document.getElementById('dev-admin-list');
            if (!list) return;

            const users = await fetchAllowedUsersFromServer();

            list.innerHTML = '';

            const masterItem = document.createElement('div');
            masterItem.className = 'admin-item';
            masterItem.style.borderColor = 'var(--neon-green)';
            masterItem.innerHTML = `<span style="color:var(--neon-green); font-weight:900;">${MASTER_ADMIN} [ROOT]</span>`;
            list.appendChild(masterItem);

            users.forEach(id => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <span>USER: ${id}</span> 
                    <span class="del-btn" onclick="devRemoveAdmin('${id}')">DROP</span>
                `;
                list.appendChild(item);
            });
        }

        // === Live Theme Editor ===
        window.applyLiveTheme = function() {
            const root = document.documentElement;

            const green = document.getElementById('theme-green').value;
            const purple = document.getElementById('theme-purple').value;
            const red = document.getElementById('theme-red').value;

            root.style.setProperty('--neon-green', green);
            root.style.setProperty('--neon-purple', purple);
            root.style.setProperty('--neon-red', red);

            const opacity = document.getElementById('glass-opacity').value;
            document.getElementById('glass-opacity-val').innerText = opacity;
            root.style.setProperty('--glass-bg', `rgba(12, 18, 38, ${opacity / 100})`);

            const radius = document.getElementById('card-radius').value;
            document.getElementById('radius-val').innerText = radius;
            // Note: Since cards are modified, you might want to apply this dynamically, but static is fine for now
        };

        window.saveThemeToStorage = function() {
            const theme = {
                green: document.getElementById('theme-green').value,
                purple: document.getElementById('theme-purple').value,
                red: document.getElementById('theme-red').value,
                glassOpacity: document.getElementById('glass-opacity').value,
                cardRadius: document.getElementById('card-radius').value
            };
            SafeStorage.setItem('dev_theme', JSON.stringify(theme));
            alert('Тема успешно сохранена! Она будет применяться при следующем запуске приложения.');
        };

        window.resetThemeToDefault = function() {
            const root = document.documentElement;
            root.style.setProperty('--neon-green', '#00FFAA');

            // ==================== PATTERN CHART GENERATOR ====================
            function getPatternChartSvg(patternName, isBig = false) {
                const w = isBig ? 440 : 340;
                const h = isBig ? 230 : 100;
                const candleW = isBig ? 24 : 15;
                const gap = isBig ? 20 : 12;

                let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w}${h}" xmlns="http://www.w3.org/2000/svg">`;
                svg += `<rect width="${w}" height="${h}" fill="#0a1224" rx="14"/>`;

                const startX = isBig ? 28 : 16;
                let x = startX;
                const name = patternName.toLowerCase();

                function drawCandle(cx, open, high, low, close, isBull) {
                    const color = isBull ? '#00FFAA' : '#FF2E63';
                    const bodyTop = Math.min(open, close);
                    const bodyH = Math.max(Math.abs(close - open), 4);
                    // Wick
                    svg += `<line x1="${cx + candleW/2}" y1="${high}" x2="${cx + candleW/2}" y2="${low}" stroke="${color}" stroke-width="${isBig ? 2.8 : 2}"/>`;
                    // Body
                    svg += `<rect x="${cx}" y="${bodyTop}" width="${candleW}" height="${bodyH}" fill="${color}" rx="3"/>`;
                }

                // ==================== СВЕЧНЫЕ ПАТТЕРНЫ ====================
                if (name.includes('доджи')) {
                    for (let i = 0; i < 7; i++) {
                        if (i === 3) {
                            svg += `<line x1="${x + candleW/2}" y1="48" x2="${x + candleW/2}" y2="82" stroke="#00FFAA" stroke-width="${isBig ? 3 : 2}"/>`;
                            svg += `<rect x="${x + 5}" y="62" width="${candleW - 10}" height="6" fill="#00FFAA" rx="2"/>`;
                        } else {
                            const bull = i < 3;
                            const base = 58 + (i % 2) * 3;
                            drawCandle(x, base - (bull ? 16 : 7), base - 26, base + 20, base + (bull ? 4 : -10), bull);
                        }
                        x += candleW + gap;
                    }
                } 
                else if (name.includes('молот')) {
                    // Uptrend → Hammer at support → reversal up
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) {
                            const hx = x;
                            svg += `<line x1="${hx + candleW/2}" y1="32" x2="${hx + candleW/2}" y2="92" stroke="#00FFAA" stroke-width="${isBig ? 3.2 : 2.2}"/>`;
                            svg += `<rect x="${hx + 4}" y="74" width="${candleW - 8}" height="10" fill="#00FFAA" rx="2"/>`;
                        } else {
                            const bull = i < 3;
                            drawCandle(x, 55 + (i*3), 38, 88, 58 + (bull ? -9 : 11), bull);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('повешенный')) {
                    // Uptrend → Hanging Man → reversal down
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) {
                            const hx = x;
                            svg += `<line x1="${hx + candleW/2}" y1="28" x2="${hx + candleW/2}" y2="88" stroke="#FF2E63" stroke-width="${isBig ? 3.2 : 2.2}"/>`;
                            svg += `<rect x="${hx + 4}" y="70" width="${candleW - 8}" height="10" fill="#FF2E63" rx="2"/>`;
                        } else {
                            const bull = i < 4;
                            drawCandle(x, 48 + (i*2), 32, 82, 52 + (bull ? -8 : 10), bull);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('перевернутый молот')) {
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) {
                            const hx = x;
                            svg += `<line x1="${hx + candleW/2}" y1="30" x2="${hx + candleW/2}" y2="90" stroke="#00FFAA" stroke-width="${isBig ? 3 : 2}"/>`;
                            svg += `<rect x="${hx + 4}" y="32" width="${candleW - 8}" height="10" fill="#00FFAA" rx="2"/>`;
                        } else {
                            drawCandle(x, 52, 34, 85, 55, i < 3);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('падающая звезда')) {
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) {
                            const hx = x;
                            svg += `<line x1="${hx + candleW/2}" y1="28" x2="${hx + candleW/2}" y2="88" stroke="#FF2E63" stroke-width="${isBig ? 3 : 2}"/>`;
                            svg += `<rect x="${hx + 4}" y="30" width="${candleW - 8}" height="10" fill="#FF2E63" rx="2"/>`;
                        } else {
                            drawCandle(x, 50, 32, 82, 53, i < 4);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('бычье поглощение')) {
                    for (let i = 0; i < 7; i++) {
                        if (i === 4) drawCandle(x, 62, 42, 76, 46, false);
                        else if (i === 5) drawCandle(x, 38, 26, 82, 76, true);
                        else drawCandle(x, 52 + (i%2)*5, 36, 78, 54 + (i < 3 ? -6 : 8), i < 3 || i > 5);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('медвежье поглощение')) {
                    for (let i = 0; i < 7; i++) {
                        if (i === 4) drawCandle(x, 42, 28, 58, 50, true);
                        else if (i === 5) drawCandle(x, 58, 30, 82, 36, false);
                        else drawCandle(x, 50, 34, 72, 52, i < 4);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('утренняя звезда')) {
                    for (let i = 0; i < 7; i++) {
                        if (i === 3) drawCandle(x, 72, 34, 86, 38, false);
                        else if (i === 4) { // small star
                            svg += `<line x1="${x + candleW/2}" y1="46" x2="${x + candleW/2}" y2="68" stroke="#FFD700" stroke-width="2.5"/>`;
                            svg += `<rect x="${x+6}" y="54" width="10" height="6" fill="#FFD700" rx="2"/>`;
                        }
                        else if (i === 5) drawCandle(x, 36, 24, 62, 58, true);
                        else drawCandle(x, 54, 38, 74, 52, i < 2);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('вечерняя звезда')) {
                    for (let i = 0; i < 7; i++) {
                        if (i === 3) drawCandle(x, 36, 24, 58, 54, true);
                        else if (i === 4) {
                            svg += `<line x1="${x + candleW/2}" y1="46" x2="${x + candleW/2}" y2="68" stroke="#FFD700" stroke-width="2.5"/>`;
                            svg += `<rect x="${x+6}" y="54" width="10" height="6" fill="#FFD700" rx="2"/>`;
                        }
                        else if (i === 5) drawCandle(x, 68, 36, 86, 40, false);
                        else drawCandle(x, 52, 36, 72, 50, i < 3);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('три белых солдата')) {
                    for (let i = 0; i < 7; i++) {
                        if (i >= 3 && i <= 5) {
                            const off = (i-3) * 6;
                            drawCandle(x, 62 - off, 30 - off, 78, 40 - off, true);
                        } else {
                            drawCandle(x, 54, 38, 72, 56, i < 2);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('три черные вороны')) {
                    for (let i = 0; i < 7; i++) {
                        if (i >= 3 && i <= 5) {
                            const off = (i-3) * 6;
                            drawCandle(x, 44 + off, 28, 82 - off, 70 + off, false);
                        } else {
                            drawCandle(x, 52, 36, 70, 54, i < 2);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('проникающая линия')) {
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) drawCandle(x, 66, 42, 76, 48, false);
                        else if (i === 5) drawCandle(x, 50, 28, 62, 58, true);
                        else drawCandle(x, 54, 38, 72, 52, i < 3);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('темная облачность')) {
                    for (let i = 0; i < 6; i++) {
                        if (i === 4) drawCandle(x, 40, 26, 58, 52, true);
                        else if (i === 5) drawCandle(x, 52, 30, 82, 44, false);
                        else drawCandle(x, 52, 36, 70, 50, i < 3);
                        x += candleW + gap;
                    }
                }
                // ==================== ГРАФИЧЕСКИЕ ПАТТЕРНЫ (с геометрией) ====================
                else if (name.includes('голова и плечи')) {
                    // Uptrend → Head & Shoulders → reversal down
                    const hsY = [58, 46, 72, 32, 76, 44, 60, 68];
                    for (let i = 0; i < 8; i++) {
                        const y = hsY[i];
                        drawCandle(x, y-7, y-20, y+14, y + (i%2 ? 5 : -3), i < 3 || i === 7);
                        x += candleW + gap;
                    }
                    // Neckline + shoulders
                    if (isBig) {
                        svg += `<line x1="${startX+18}" y1="64" x2="${startX + 7*(candleW+gap)+8}" y2="64" stroke="#9D00FF" stroke-width="2" stroke-dasharray="5,3"/>`;
                        svg += `<text x="${startX + 85}" y="58" fill="#9D00FF" font-size="11" font-weight="700">NECKLINE</text>`;
                    }
                }
                else if (name.includes('обратная голова и плечи')) {
                    const hsY = [62, 74, 48, 82, 46, 70, 58, 52];
                    for (let i = 0; i < 8; i++) {
                        const y = hsY[i];
                        drawCandle(x, y-6, y-18, y+12, y + (i%2 ? -4 : 4), i > 2);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX+18}" y1="66" x2="${startX + 7*(candleW+gap)+8}" y2="66" stroke="#00FFAA" stroke-width="2" stroke-dasharray="5,3"/>`;
                    }
                }
                else if (name.includes('двойная вершина')) {
                    // Up → Double Top → reversal down
                    for (let i = 0; i < 8; i++) {
                        let y = 58;
                        if (i === 2 || i === 5) y = 34; // two tops
                        if (i > 5) y = 48 + (i-6)*4;
                        drawCandle(x, y-6, y-18, y+12, y+3, i < 2);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX+10}" y1="62" x2="${startX + 7*(candleW+gap)+4}" y2="62" stroke="#FF2E63" stroke-width="1.8" stroke-dasharray="4,2"/>`;
                    }
                }
                else if (name.includes('двойное дно')) {
                    for (let i = 0; i < 8; i++) {
                        let y = 52;
                        if (i === 2 || i === 5) y = 78; // two bottoms
                        if (i > 5) y = 58 - (i-6)*3;
                        drawCandle(x, y-5, y-16, y+11, y+2, i > 4);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX+10}" y1="64" x2="${startX + 7*(candleW+gap)+4}" y2="64" stroke="#00FFAA" stroke-width="1.8" stroke-dasharray="4,2"/>`;
                    }
                }
                else if (name.includes('восходящий треугольник')) {
                    // Rising lows + flat resistance (bullish)
                    for (let i = 0; i < 8; i++) {
                        const low = 48 + i * 3.5;
                        const high = 38;
                        drawCandle(x, low + 8, high, low + 22, low + 14, true);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX}" y1="40" x2="${startX + 7*(candleW+gap)+20}" y2="40" stroke="#00FFAA" stroke-width="2"/>`;
                        svg += `<line x1="${startX+10}" y1="72" x2="${startX + 6*(candleW+gap)}" y2="42" stroke="#9D00FF" stroke-width="1.5"/>`;
                    }
                }
                else if (name.includes('нисходящий треугольник')) {
                    for (let i = 0; i < 8; i++) {
                        const high = 72 - i * 3.5;
                        drawCandle(x, high - 10, high, 82, high - 4, false);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX}" y1="80" x2="${startX + 7*(candleW+gap)+20}" y2="80" stroke="#FF2E63" stroke-width="2"/>`;
                        svg += `<line x1="${startX+10}" y1="38" x2="${startX + 6*(candleW+gap)}" y2="76" stroke="#9D00FF" stroke-width="1.5"/>`;
                    }
                }
                else if (name.includes('симметричный треугольник')) {
                    for (let i = 0; i < 8; i++) {
                        const squeeze = (i - 3.5) * 3.2;
                        const y = 55 + squeeze;
                        drawCandle(x, y-6, y-17, y+11, y+2, i < 4);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX}" y1="38" x2="${startX + 7*(candleW+gap)+10}" y2="72" stroke="#9D00FF" stroke-width="1.8"/>`;
                        svg += `<line x1="${startX}" y1="72" x2="${startX + 7*(candleW+gap)+10}" y2="38" stroke="#9D00FF" stroke-width="1.8"/>`;
                    }
                }
                else if (name.includes('восходящий клин')) {
                    for (let i = 0; i < 8; i++) {
                        const y = 48 + i * 3.8;
                        drawCandle(x, y-5, y-16, y+10, y+1, i < 3);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX+5}" y1="46" x2="${startX + 6*(candleW+gap)}" y2="78" stroke="#FF2E63" stroke-width="2"/>`;
                        svg += `<line x1="${startX+18}" y1="38" x2="${startX + 7*(candleW+gap)+8}" y2="70" stroke="#FF2E63" stroke-width="2"/>`;
                    }
                }
                else if (name.includes('нисходящий клин')) {
                    for (let i = 0; i < 8; i++) {
                        const y = 78 - i * 3.8;
                        drawCandle(x, y-5, y-15, y+9, y+2, i > 4);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX+5}" y1="76" x2="${startX + 6*(candleW+gap)}" y2="44" stroke="#00FFAA" stroke-width="2"/>`;
                        svg += `<line x1="${startX+18}" y1="68" x2="${startX + 7*(candleW+gap)+8}" y2="36" stroke="#00FFAA" stroke-width="2"/>`;
                    }
                }
                else if (name.includes('флаг')) {
                    // Strong up move → flag consolidation → continuation
                    for (let i = 0; i < 8; i++) {
                        if (i < 2) {
                            drawCandle(x, 72 - i*8, 38, 88, 48 - i*6, true);
                        } else if (i >= 2 && i <= 5) {
                            const y = 52 + (i-3.5)*5;
                            drawCandle(x, y-4, y-13, y+9, y+2, false);
                        } else {
                            drawCandle(x, 48 - (i-6)*5, 32, 62, 42 - (i-6)*4, true);
                        }
                        x += candleW + gap;
                    }
                }
                else if (name.includes('вымпел')) {
                    for (let i = 0; i < 8; i++) {
                        if (i < 2) drawCandle(x, 68 - i*7, 36, 84, 46 - i*5, true);
                        else if (i >= 2 && i <= 5) {
                            const sq = (i-3.5) * 4;
                            drawCandle(x, 52 + sq, 42 - Math.abs(sq)*0.6, 64 + sq, 54 + sq*0.3, i % 2 === 0);
                        } else drawCandle(x, 46 - (i-6)*4, 30, 58, 40 - (i-6)*3, true);
                        x += candleW + gap;
                    }
                }
                else if (name.includes('прямоугольник')) {
                    for (let i = 0; i < 8; i++) {
                        const y = (i % 2 === 0) ? 42 : 72;
                        drawCandle(x, y-5, y-15, y+10, y+2, i % 3 === 0);
                        x += candleW + gap;
                    }
                    if (isBig) {
                        svg += `<line x1="${startX}" y1="44" x2="${startX + 7*(candleW+gap)+12}" y2="44" stroke="#9D00FF" stroke-width="1.5" stroke-dasharray="3,2"/>`;
                        svg += `<line x1="${startX}" y1="70" x2="${startX + 7*(candleW+gap)+12}" y2="70" stroke="#9D00FF" stroke-width="1.5" stroke-dasharray="3,2"/>`;
                    }
                }
                else if (name.includes('чашка')) {
                    // U-shape + handle
                    for (let i = 0; i < 8; i++) {
                        let y = 68;
                        if (i < 3) y = 42 + i * 9;
                        if (i > 5) y = 52 + (i-6) * 6;
                        drawCandle(x, y-5, y-15, y+10, y+1, i > 4 || i < 1);
                        x += candleW + gap;
                    }
                }
                // ==================== ГАРМОНИЧЕСКИЕ ====================
                else if (name.includes('гартли') || name.includes('летучая') || name.includes('бабочка') || name.includes('краб') || name.includes('акула')) {
                    const pointsY = name.includes('бабочка') ? [72, 38, 78, 28, 62] : 
                                   name.includes('краб') ? [68, 44, 82, 24, 58] : [65, 42, 74, 32, 68];
                    for (let i = 0; i < 5; i++) {
                        const y = pointsY[i];
                        drawCandle(x, y-5, y-16, y+10, y+2, i % 2 === 0);
                        if (isBig) {
                            svg += `<text x="${x + candleW/2 - 5}" y="${y - 24}" fill="#9D00FF" font-size="13" font-weight="800">${['X','A','B','C','D'][i]}</text>`;
                        }
                        x += candleW + gap + 6;
                    }
                    if (isBig) {
                        svg += `<path d="M${startX+14} 68 Q${startX+90} 36,${startX+170} 76 Q${startX+250} 26,${startX+320} 64" fill="none" stroke="#9D00FF" stroke-width="2" opacity="0.55"/>`;
                    }
                }
                else {
                    // Default clean chart
                    for (let i = 0; i < 7; i++) {
                        const bull = (i + 1) % 3 !== 0;
                        const base = 52 + (i % 3) * 4;
                        drawCandle(x, base - (bull ? 14 : 6), base - 24, base + 18, base + (bull ? 4 : -9), bull);
                        x += candleW + gap;
                    }
                }

                svg += `</svg>`;
                return svg;
            }

            // ==================== STRATEGY CHART GENERATOR ====================
            function getStrategyChartSvg(strategyName, isBig = false) {
                const w = isBig ? 440 : 320;
                const h = isBig ? 210 : 95;
                const candleW = isBig ? 22 : 14;
                const gap = isBig ? 18 : 11;

                let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w}${h}" xmlns="http://www.w3.org/2000/svg">`;
                svg += `<rect width="${w}" height="${h}" fill="#0a1224" rx="12"/>`;

                const startX = isBig ? 30 : 18;
                let x = startX;
                const name = strategyName.toLowerCase();

                function drawCandle(cx, open, high, low, close, isBull) {
                    const color = isBull ? '#00FFAA' : '#FF2E63';
                    const bodyTop = Math.min(open, close);
                    const bodyH = Math.max(Math.abs(close - open), 3);
                    svg += `<line x1="${cx + candleW/2}" y1="${high}" x2="${cx + candleW/2}" y2="${low}" stroke="${color}" stroke-width="${isBig ? 2.5 : 1.8}"/>`;
                    svg += `<rect x="${cx}" y="${bodyTop}" width="${candleW}" height="${bodyH}" fill="${color}" rx="2"/>`;
                }

                // RSI - oversold + reversal up
                if (name.includes('rsi')) {
                    // Price candles showing reversal
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 5 || (i > 2 && i < 5);
                        const base = 48 + (i < 4 ? (3-i)*2 : (i-5)*3);
                        drawCandle(x, base - (bull ? 12 : 5), base - 22, base + 16, base + (bull ? 3 : -8), bull);
                        x += candleW + gap;
                    }
                    // RSI line at bottom
                    svg += `<rect x="12" y="78" width="${w-24}" height="14" fill="#1a2338" rx="3"/>`;
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">RSI 14</text>`;
                    // Oversold zone highlight
                    svg += `<rect x="140" y="80" width="60" height="10" fill="rgba(0,255,170,0.25)"/>`;
                    svg += `<text x="155" y="88" fill="#00FFAA" font-size="7" font-weight="700">OVERSOLD</text>`;
                    // Arrow up
                    svg += `<polygon points="${w-45},${h-18} ${w-35},${h-28} ${w-25},${h-18}" fill="#00FFAA"/>`;
                    svg += `<text x="${w-55}" y="${h-8}" fill="#00FFAA" font-size="9" font-weight="800">CALL</text>`;
                }
                // MACD crossover
                else if (name.includes('macd')) {
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 4;
                        const base = 45 + (i < 3 ? -i*1.5 : (i-4)*4);
                        drawCandle(x, base - (bull ? 10 : 6), base - 20, base + 14, base + (bull ? 4 : -7), bull);
                        x += candleW + gap;
                    }
                    // MACD lines
                    svg += `<line x1="30" y1="72" x2="${w-20}" y2="72" stroke="#9D00FF" stroke-width="1.5"/>`;
                    svg += `<line x1="30" y1="68" x2="${w-20}" y2="78" stroke="#00FFAA" stroke-width="2"/>`;
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">MACD + Signal</text>`;
                    svg += `<polygon points="${w-50},58 ${w-40},48${w-30},58" fill="#00FFAA"/>`;
                    svg += `<text x="${w-60}" y="46" fill="#00FFAA" font-size="9" font-weight="800">CROSS UP</text>`;
                }
                // Bollinger Bands - squeeze + breakout
                else if (name.includes('bollinger')) {
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 5;
                        const base = 50;
                        drawCandle(x, base - (bull ? 8 : 4), base - 18, base + 12, base + (bull ? 5 : -5), bull);
                        x += candleW + gap;
                    }
                    // Bands
                    svg += `<path d="M20,32 Q80,38 140,35 Q200,32 260,28" fill="none" stroke="#9D00FF" stroke-width="1.5"/>`;
                    svg += `<path d="M20,68 Q80,62 140,65 Q200,68 260,72" fill="none" stroke="#9D00FF" stroke-width="1.5"/>`;
                    svg += `<path d="M20,50 Q80,50 140,50 Q200,50 260,50" fill="none" stroke="#00FFAA" stroke-width="1" stroke-dasharray="3,2"/>`;
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">Bollinger Squeeze → Breakout</text>`;
                    svg += `<polygon points="${w-45},42 ${w-35},32${w-25},42" fill="#00FFAA"/>`;
                }
                // Moving Averages crossover
                else if (name.includes('moving') || name.includes('ma ') || name.includes('ema') || name.includes('sma')) {
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 3;
                        const base = 48 + (i < 4 ? (3-i)*2 : 0);
                        drawCandle(x, base - (bull ? 11 : 5), base - 21, base + 15, base + (bull ? 3 : -6), bull);
                        x += candleW + gap;
                    }
                    // Two MA lines
                    svg += `<path d="M22,55 Q70,48 120,52 Q170,60 220,48" fill="none" stroke="#00FFAA" stroke-width="2.5"/>`;
                    svg += `<path d="M22,62 Q70,58 120,55 Q170,50 220,42" fill="none" stroke="#9D00FF" stroke-width="2"/>`;
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">EMA9 / EMA21 Golden Cross</text>`;
                    svg += `<polygon points="${w-45},38 ${w-35},28${w-25},38" fill="#00FFAA"/>`;
                }
                // Parabolic SAR
                else if (name.includes('parabolic') || name.includes('sar')) {
                    for (let i = 0; i < 8; i++) {
                        const bull = i < 5;
                        const base = 50;
                        drawCandle(x, base - (bull ? 10 : 4), base - 19, base + 13, base + (bull ? 3 : -5), bull);
                        // SAR dots
                        const sarY = bull ? 38 : 62;
                        svg += `<circle cx="${x + candleW/2}" cy="${sarY}" r="3" fill="#FF2E63"/>`;
                        x += candleW + gap;
                    }
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">SAR reversal → Trend change</text>`;
                }
                // Alligator
                else if (name.includes('alligator') || name.includes('аллигатор')) {
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 4;
                        const base = 48;
                        drawCandle(x, base - (bull ? 9 : 5), base - 18, base + 12, base + (bull ? 4 : -4), bull);
                        x += candleW + gap;
                    }
                    // 3 Alligator lines
                    svg += `<path d="M18,42 Q60,38 110,45 Q160,52 210,40" fill="none" stroke="#00FFAA" stroke-width="2"/>`;
                    svg += `<path d="M18,50 Q60,48 110,52 Q160,48 210,46" fill="none" stroke="#FFAA00" stroke-width="1.8"/>`;
                    svg += `<path d="M18,58 Q60,56 110,55 Q160,52 210,50" fill="none" stroke="#9D00FF" stroke-width="1.5"/>`;
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">Alligator awakening → New trend</text>`;
                }
                // Default nice chart for other strategies
                else {
                    for (let i = 0; i < 8; i++) {
                        const bull = i > 4 || (i > 1 && i < 4);
                        const base = 48 + (i % 3) * 2;
                        drawCandle(x, base - (bull ? 10 : 5), base - 20, base + 14, base + (bull ? 3 : -7), bull);
                        x += candleW + gap;
                    }
                    svg += `<text x="18" y="88" fill="#a4b1cd" font-size="8">${strategyName.split(' ')[0]} • M1 signal</text>`;
                    svg += `<polygon points="${w-45},42 ${w-35},32${w-25},42" fill="#00FFAA"/>`;
                }

                svg += `</svg>`;
                return svg;
            }

                    el.className = 'pattern-card';

                    el.innerHTML = `
                        <div class="pattern-header">
                            <div>
                                <div class="pattern-name">${p.name}</div>
                            </div>

                    renderStrategiesList();

                const filtered = POCKET_OPTION_INDICATORS.filter(i =>

                renderStrategiesList(filtered);

            function switchScreen(screenId) {
                screens.forEach(screen => {
                    screen.classList.remove('active');
                    screen.style.setProperty('display', 'none', 'important'); 
                });

                const targetScreen = document.getElementById(screenId);
                if (targetScreen) {
                    targetScreen.classList.add('active');
                    targetScreen.style.setProperty('display', 'block', 'important');
                    
                    if (screenId === 'bot-analysis-screen') {
                        setAssetCategory('forex');
                        setTimeout(() => filterAnalysisPairs(), 100);
                    }
                    if (screenId === 'profile-screen') updateProfileAiHint();
                    if (screenId === 'sessions-screen') {
                        const dep = document.getElementById('calc-deposit');
                        if (dep) dep.value = currentBalance || 1000;
                        if (typeof calculateTradingPlan === 'function') calculateTradingPlan();
                    }
                    if (screenId === 'patterns-screen') {
                        setTimeout(() => {
                            if (typeof loadPatternsAndStrategies === 'function') loadPatternsAndStrategies();
                        }, 80);
                    }
                    if (screenId === 'strategies-screen') {
                        setTimeout(() => {
                            if (typeof renderStrategiesList === 'function') renderStrategiesList();
                            const s = document.getElementById('strategy-search');
                            if (s) s.value = '';
                        }, 80);
                    }
                    if (screenId === 'news-screen') {
                        setTimeout(() => {
                            if (typeof switchNewsTab === 'function') {
                                switchNewsTab('grok');
                            }
                        }, 80);
                    }
                    if (screenId === 'traders-chat-screen') {
                        setTimeout(async () => {
                            if (typeof loadTradersChatMessages === 'function') {
                                await loadTradersChatMessages();
                            }
                            
                            if (typeof subscribeToTraderChat === 'function') {
                                subscribeToTraderChat();
                            }

                            const onlineEl = document.getElementById('chat-online-count');
                            if (onlineEl) onlineEl.innerText = '0';
                        }, 150);
                    }
                }
            }

                let stake = balance * 0.02;
                const stakeEl = document.getElementById('ai-calc-stake');
                if(stakeEl) stakeEl.innerText = `$${stake.toFixed(2)}`;
                
                let weekProfit = balance * 0.60;
                const weekEl = document.getElementById('ai-weekly-forecast');
                if(weekEl) weekEl.innerText = `$${weekProfit.toFixed(2)}`;
            }

            window.syncBalances = function(val) {
                let parsed = parseFloat(val) || 0;
                currentBalance = parsed;
                localStorage.setItem('pocket_balance', parsed);
                
                const mainInput = document.getElementById('main-pocket-input');
                const profileInput = document.getElementById('profile-pocket-input');
                if(mainInput && mainInput.value != val) mainInput.value = val;
                if(profileInput && profileInput.value != val) profileInput.value = val;
                
                calculateStake(parsed);
                updateProfileAiHint();
            };

                let balance = currentBalance;

            }
